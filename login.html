<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101211" />
    <meta name="description" content="Sign in to M.R-V.E. Master Video Editor, private creative workspace." />
    <title>Sign in | M.R-V.E. Master Video Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="login.js" defer></script>
  </head>
  <body class="auth-page">
    <div class="login-beams" aria-hidden="true">
      <span class="beam beam-one"></span>
      <span class="beam beam-two"></span>
      <span class="beam beam-three"></span>
      <span class="beam beam-four"></span>
    </div>

    <div class="login-watermark" aria-hidden="true">M.R-V.E.</div>

    <main class="login-screen">
      <section class="login-panel" aria-labelledby="login-title">
        <a class="brand login-brand" href="/" aria-label="M.R-V.E. Master Video Editor">
          <span class="brand-mark">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span class="brand-copy">
            <strong>M.R-V.E.</strong>
            <small>MASTER VIDEO EDITOR</small>
          </span>
        </a>

        <div class="login-eyebrow">
          <span class="eyebrow-line"></span> PRIVATE CREATIVE WORKSPACE
        </div>

        <div class="auth-toggle" aria-label="Authentication mode selector">
          <button class="auth-tab is-active" type="button" data-auth-mode="login">Sign In</button>
          <button class="auth-tab" type="button" data-auth-mode="register">Sign Up</button>
        </div>

        <h1 id="login-title">Welcome back.</h1>
        <p class="login-intro">Sign in to launch your studio timeline and creative workspaces.</p>

        <form class="login-form" id="login-form" novalidate>
          <div class="field-group">
            <label class="login-label" for="login-username">
              <span>Email address</span>
              <span class="login-label-hint">Required</span>
            </label>
            <div class="login-input-wrap">
              <input
                class="login-input"
                id="login-username"
                name="username"
                type="email"
                autocomplete="username"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <div class="field-group" id="register-name-group" hidden>
            <label class="login-label" for="register-name">
              <span>Display name</span>
              <span class="login-label-hint">Optional</span>
            </label>
            <div class="login-input-wrap">
              <input
                class="login-input"
                id="register-name"
                name="name"
                type="text"
                autocomplete="name"
                placeholder="Your studio name"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="login-label" for="login-password">
              <span>Password</span>
              <span class="login-label-hint">Required</span>
            </label>
            <div class="login-input-wrap">
              <input
                class="login-input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <p class="login-error" id="login-error" role="alert" hidden></p>

          <button class="login-submit" id="login-submit" type="submit">
            <span class="login-submit-label">Enter Studio</span>
            <span class="submit-arrow">&rarr;</span>
          </button>
        </form>

        <p class="login-footnote">
          Secured with M.R-V.E. cryptographic session tokens.
        </p>
      </section>

      <div class="login-art" aria-hidden="true">
        <div class="login-art-ring"></div>
        <div class="login-art-ring ring-b"></div>
        <div class="login-art-mark">M<span>.</span>V<span>.</span>E<span>.</span></div>
        <div class="login-art-caption">
          MAKE THE MOMENT<br />MATTER.
        </div>
        <span class="login-art-index"><i></i> STUDIO / 01 &middot; SECURED</span>
      </div>
    </main>
  </body>
</html>
