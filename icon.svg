<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#101211" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#292e2b" stroke-width="4" />
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff52" />
      <stop offset="50%" stop-color="#67d9bf" />
      <stop offset="100%" stop-color="#f3a276" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Decorative brand bars -->
  <g transform="translate(136, 110)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#d4ff52" opacity="0.9" />
    <rect x="80" y="0" width="100" height="20" rx="4" fill="#67d9bf" opacity="0.8" />
    <rect x="195" y="0" width="45" height="20" rx="4" fill="#f3a276" opacity="0.9" />
  </g>
  <!-- Center M.V.E text -->
  <text x="256" y="295" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="110" font-weight="800" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">MVE</text>
  <text x="256" y="365" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#848b85" text-anchor="middle" letter-spacing="8">STUDIO</text>
</svg>
